<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stockroom inventory</title>
  <link rel="stylesheet" href="/catalog.css">
  <script type="module" src="/catalog.js"></script>
</head>
<body>
  <header><span class="brand">Stockroom</span></header>
  <main>
    <h1>Inventory</h1>
    <section aria-label="Stock catalog">
      <div class="toolbar">
        <p role="status">Loading inventory…</p>
        <div id="controls"></div>
      </div>
      <table hidden>
        <thead><tr><th scope="col">Item</th><th scope="col">SKU</th><th scope="col">Availability</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
</body>
</html>
